name: Auto Version Bump & Trigger Build

on:
  push:
    branches: [main]

concurrency:
  group: auto-version
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - module: module-controller
            workflow: docker-module-controller.yml
          - module: mouse-quiz-demo
            workflow: docker-mouse-quiz-demo.yml
          - module: vqa-illusion-demo
            workflow: docker-vqa-illusion-demo.yml
          - module: vqa-image-demo
            workflow: docker-vqa-image-demo.yml

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if module changed
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"

          # 첫 push인 경우 before가 zeros
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          COUNT=$(git diff --name-only "$BEFORE" "$SHA" | grep "^apps/${{ matrix.module }}/" | wc -l)
          if [[ "$COUNT" -gt 0 ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump patch version and push tag
        id: version
        if: steps.changed.outputs.changed == 'true'
        run: |
          MODULE="${{ matrix.module }}"
          PREFIX="${MODULE}/v"

          git fetch --tags
          LATEST=$(git tag -l "${PREFIX}*" | sort -V | tail -1)

          if [[ -z "$LATEST" ]]; then
            NEW_VERSION="0.1.0"
          else
            VERSION="${LATEST#${PREFIX}}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          NEW_TAG="${PREFIX}${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped: ${NEW_TAG}"

      - name: Trigger Docker build
        if: steps.changed.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ matrix.workflow }}',
              ref: 'main',
              inputs: {
                version: '${{ steps.version.outputs.version }}'
              }
            })
            console.log('Triggered ${{ matrix.workflow }} with version ${{ steps.version.outputs.version }}')
