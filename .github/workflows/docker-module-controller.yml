name: Build & Push module-controller to Docker Hub

on:
  push:
    tags:
      - 'module-controller/v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '배포 버전 (예: 0.1.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        run: |
          IMAGE="hamstead/truve_genai-module-controller"
          SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/module-controller/v* ]]; then
            VERSION="${GITHUB_REF_NAME#module-controller/v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          else
            TAGS="${IMAGE}:main-${SHA},${IMAGE}:dev"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Tagging as: $TAGS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hamstead
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/module-controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
