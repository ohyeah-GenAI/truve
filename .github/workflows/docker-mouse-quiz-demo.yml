name: Build & Push mouse-quiz-demo to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - 'mouse-quiz-demo/v*.*.*'
    paths:
      - 'apps/mouse-quiz-demo/**'
  workflow_dispatch:
    inputs:
      version:
        description: '배포 버전 (예: 0.1.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        run: |
          IMAGE="hamstead/truve_genai-mouse-quiz-demo"
          SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/mouse-quiz-demo/v* ]]; then
            # git tag: mouse-quiz-demo/v0.1.0  →  image tag: 0.1.0
            VERSION="${GITHUB_REF_NAME#mouse-quiz-demo/v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            # workflow_dispatch에서 버전 직접 지정
            VERSION="${{ github.event.inputs.version }}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          else
            # main 브랜치 push → main-<sha> 태그
            TAGS="${IMAGE}:main-${SHA},${IMAGE}:dev"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Tagging as: $TAGS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hamstead
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/mouse-quiz-demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
