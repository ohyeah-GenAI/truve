[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqa-bot-detection"
version = "0.1.0"
description = "VQA and bot detection collaboration repository"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_smoke: model-executing Illusion-VQA smoke coverage for explicit local MPS runs",
]
